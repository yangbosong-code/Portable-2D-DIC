# Local end-to-end demonstration without a physical camera.
# Bounded periodic motion remains inside the DIC search window indefinitely,
# allowing preview, displacement, strain, storage, and performance inspection.
camera.backend=synthetic
synthetic.seed=7
synthetic.dx_per_frame=0.02
synthetic.dy_per_frame=0.01
synthetic.motion=sinusoidal
synthetic.amplitude_x=2.0
synthetic.amplitude_y=1.0
synthetic.frequency_hz=0.1
image.width=512
image.height=512
image.fps=20
camera.offset_x=0
camera.offset_y=0
dic.backend=cpu
dic.subset_radius=18
dic.grid_step=64
dic.search_radius=6
dic.max_iterations=25
dic.convergence_tolerance=0.01
dic.quality_threshold=0.80
dic.maximum_iteration_step=1.0
dic.recovery_trigger_valid_ratio=0.95
dic.max_recovery_passes=1
dic.inverse_compositional=false
runtime.frame_pool_size=8
runtime.capture_queue_size=3
network.bind_address=0.0.0.0
network.control_port=17840
network.result_port=17841
network.preview_port=17842
preview.enabled=true
preview.maximum_width=960
preview.maximum_height=720
preview.fps=10
storage.root=sessions
storage.csv_enabled=false
storage.queue_capacity=64
storage.flush_every_frames=30
